<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        بوابة الوعي والوفرة | إبتسام عيساوي
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="site-header">

    <h1>
        بوابة الوعي والوفرة
    </h1>

    <p>
        إبتسام عيساوي
    </p>

</header>



<main>


    <!-- =================================================
         Courses
         ================================================= -->

    <section class="section">

        <h2>
            الدورات
        </h2>

        <div
            id="courses"
            class="services-grid"
        >

            <p>
                جاري تحميل الدورات...
            </p>

        </div>

    </section>



    <!-- =================================================
         Purchase Form
         ================================================= -->

    <div
        id="purchase-form"
        class="purchase-form"
        style="display:none;"
    >

        <h2>
            إتمام الطلب
        </h2>


        <!-- Selected service -->

        <div id="selected-service"></div>



        <!-- Customer information -->

        <form id="customer-form">


            <label for="first-name">
                الاسم
            </label>

            <input
                type="text"
                id="first-name"
                required
            >



            <label for="last-name">
                اللقب
            </label>

            <input
                type="text"
                id="last-name"
                required
            >



            <label for="email">
                البريد الإلكتروني
            </label>

            <input
                type="email"
                id="email"
                required
            >



            <label for="phone">
                الهاتف
            </label>

            <input
                type="tel"
                id="phone"
            >



            <label for="country">
                البلد
            </label>

            <input
                type="text"
                id="country"
            >


            <!-- =================================================
                 PayPal
                 ================================================= -->

            <div
                id="paypal-section"
                style="display:none; margin-top:30px;"
            >

                <h3>
                    الدفع عبر PayPal
                </h3>

                <p>
                    بعد الضغط على زر PayPal سيتم تحويلك إلى
                    PayPal لإتمام الدفع بأمان.
                </p>


                <div
                    id="paypal-button-container"
                ></div>


                <div
                    id="paypal-message"
                    style="margin-top:15px;"
                ></div>

            </div>


        </form>

    </div>

</main>



<footer>

    <p>
        © إبتسام عيساوي
    </p>

</footer>



<!-- =====================================================
     Supabase SDK
     ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<!-- =====================================================
     PayPal Sandbox SDK
     ===================================================== -->

<script
    src="https://www.paypal.com/sdk/js?client-id=AdXkfQlTbR4xFhvGn-qH4E2eYvtzeacP6YOn30zaHs-LcAizmoBQ-DqqglzriwZCacEsWruIhdNbedcj&currency=USD&intent=capture"
></script>



<!-- =====================================================
     Application
     ===================================================== -->

<script src="app.js"></script>


</body>

</html>
