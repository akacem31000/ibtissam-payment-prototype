<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>بوابة الوعي والوفرة | إبتسام عيساوي</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">

        <h1>بوابة الوعي والوفرة</h1>

        <p>إبتسام عيساوي</p>

    </header>


    <main>

        <section class="section">

            <h2>الدورات</h2>

            <div id="courses" class="services-grid">

                <p>جاري تحميل الدورات...</p>

            </div>

        </section>
        <div id="purchase-form" class="purchase-form" style="display:none;">
    <h2>إتمام الطلب</h2>

    <div id="selected-service"></div>

    <form id="customer-form">

        <label for="first-name">الاسم</label>
        <input type="text" id="first-name" required>

        <label for="last-name">اللقب</label>
        <input type="text" id="last-name" required>

        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" required>

        <label for="phone">الهاتف</label>
        <input type="tel" id="phone">

        <label for="country">البلد</label>
        <input type="text" id="country">

        <button type="submit" class="buy-button">
            متابعة الدفع
        </button>

    </form>
</div>

    </main>


    <footer>

        <p>© إبتسام عيساوي</p>

    </footer>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Application -->

    <script src="app.js"></script>

</body>

</html>
